name: ✅ CI

on:
  pull_request:
    branches: ["main"]
  # Cho phép CD gọi lại CI trước khi build & deploy (chặn trường hợp push thẳng lên main)
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  # Chỉ huỷ run cũ với PR; khi được CD gọi thì không huỷ để tránh làm fail deploy
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRIVY_VERSION: 0.75.0

jobs:
  # =========================
  # 1️⃣ BACKEND CI
  # =========================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: n8n-server
    steps:
      - uses: actions/checkout@v4

      # Phải bật corepack TRƯỚC setup-node để cache dùng đúng Yarn 4 theo packageManager
      - name: Enable corepack
        run: corepack enable
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: n8n-server/yarn.lock

      - name: Install deps
        run: yarn install --immutable

      # Kiểm tra cú pháp TẤT CẢ file JS (không chỉ index.js)
      - name: Syntax check all source files
        run: git ls-files '*.js' '*.cjs' '*.mjs' | xargs -n1 node --check

  # =========================
  # 2️⃣ FRONTEND CI
  # =========================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: n8n-client
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: n8n-client/yarn.lock

      - name: Install deps
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

  # =========================
  # 3️⃣ DOCKER BUILD + SECURITY SCAN (no push)
  # =========================
  # Chỉ chạy cho PR. Khi CD gọi CI thì CD đã tự build & scan, không cần build 2 lần.
  docker-build-check:
    name: Docker Build & Scan (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend-ci, frontend-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./n8n-server
          - name: frontend
            context: ./n8n-client

    steps:
      - uses: actions/checkout@v4

      - name: Create Production Env for Frontend
        if: matrix.name == 'frontend'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
        run: echo "VITE_API_URL=${VITE_API_URL}" > ./n8n-client/.env.production

      - uses: docker/setup-buildx-action@v3

      - name: Build image (validate only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ci-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-

      # Shift-left: phát hiện lỗ hổng ngay ở PR thay vì đợi merge vào main
      - name: Trivy scan
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "ci-${{ matrix.name }}:${{ github.sha }}"
