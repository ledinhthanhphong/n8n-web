name: 🚀 CD (Deploy to Production)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Chỉ 1 deploy production tại 1 thời điểm, không huỷ deploy đang chạy
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRIVY_VERSION: 0.75.0
  IMAGE_TAG: ${{ github.sha }}
  # Username Docker Hub không phải bí mật -> ưu tiên Variables (log dễ đọc), fallback về Secrets
  DOCKER_NAMESPACE: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}

jobs:
  # =========================
  # 0️⃣ CI (lint / syntax check)
  # =========================
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # =========================
  # 1️⃣ BUILD → SCAN → PUSH
  # =========================
  # Image chỉ được push lên registry SAU KHI qua Trivy scan
  build-scan-push:
    name: Build, Scan & Push (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: ci
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: ./n8n-server
          - name: frontend
            context: ./n8n-client

    steps:
      - uses: actions/checkout@v4

      - name: Create Production Env for Frontend
        if: matrix.name == 'frontend'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
        run: echo "VITE_API_URL=${VITE_API_URL}" > ./n8n-client/.env.production

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image (load locally, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ env.DOCKER_NAMESPACE }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # Cache Trivy vulnerability DB để tránh tải lại mỗi lần chạy (tránh bị rate-limit)
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-

      - name: Trivy scan
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "${DOCKER_NAMESPACE}/${{ matrix.name }}:${IMAGE_TAG}"

      - name: Push image (SHA + latest)
        run: |
          IMAGE="${DOCKER_NAMESPACE}/${{ matrix.name }}"
          docker tag "${IMAGE}:${IMAGE_TAG}" "${IMAGE}:latest"
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"

  # =========================
  # 2️⃣ DEPLOY (WITH ROLLBACK)
  # =========================
  deploy:
    name: Deploy with rollback
    runs-on: self-hosted
    needs: build-scan-push
    timeout-minutes: 15
    # Bật "Required reviewers" trong Settings → Environments → production nếu muốn duyệt tay trước khi deploy
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy with rollback
        shell: bash
        env:
          APP_DIR: /home/ubuntu/app
        run: |
          set -Eeo pipefail

          compose() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }

          # Gọi URL có retry (app có thể cần vài giây sau khi container healthy)
          check_url() {
            for _ in $(seq 1 10); do
              curl -fsS -o /dev/null --max-time 5 "$1" && return 0
              sleep 3
            done
            return 1
          }

          health_check() {
            echo "Checking API via Nginx..."
            check_url http://localhost/api/v1/health || { echo "API health check via Nginx FAILED"; return 1; }
            echo "Checking Frontend UI..."
            check_url http://localhost/ || { echo "Frontend UI check FAILED"; return 1; }
          }

          mkdir -p "$APP_DIR"
          cp docker-compose.prod.yml "$APP_DIR/"
          cd "$APP_DIR"

          if [ ! -f .env.production ]; then
            echo "::error::Missing $APP_DIR/.env.production on server"
            exit 1
          fi

          export IMAGE_BACKEND="${DOCKER_NAMESPACE}/backend"
          export IMAGE_FRONTEND="${DOCKER_NAMESPACE}/frontend"
          export IMAGE_TAG

          echo "📦 Backup current version"
          # Backup theo image ID của container ĐANG chạy, không dựa vào tag ":latest"
          HAS_BACKUP=true
          for svc in backend frontend; do
            if docker inspect "n8n-$svc" >/dev/null 2>&1; then
              docker tag "$(docker inspect --format='{{.Image}}' "n8n-$svc")" "backup-$svc:latest"
            else
              echo "No running $svc container found."
              HAS_BACKUP=false
            fi
          done

          rollback() {
            trap - ERR
            set +e
            echo "::error::$1"
            compose logs --tail=100
            if [ "$HAS_BACKUP" != true ]; then
              echo "::warning::No full backup found (likely first deploy). Cannot roll back."
              exit 1
            fi
            echo "↩️ Rolling back to previous version..."
            export IMAGE_BACKEND=backup-backend IMAGE_FRONTEND=backup-frontend IMAGE_TAG=latest
            if compose up -d --pull never --wait --wait-timeout 120 && health_check; then
              echo "::warning::Rolled back to previous version successfully."
            else
              echo "::error::ROLLBACK FAILED - manual intervention required!"
            fi
            exit 1
          }
          # Bất kỳ lệnh nào fail từ đây (pull, compose up, healthcheck...) đều kích hoạt rollback
          trap 'rollback "Deploy failed (line $LINENO)"' ERR

          echo "🚀 Deploying version: $IMAGE_TAG"
          # --wait: chờ đến khi các container báo healthy (theo healthcheck trong compose)
          compose up -d --pull always --remove-orphans --wait --wait-timeout 180

          health_check || rollback "Health check failed"

          trap - ERR
          echo "✅ Deploy successful!"

          # Dọn image cũ hơn 7 ngày (image đang được container dùng sẽ không bị xoá)
          docker image prune -af --filter "until=168h" || true

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

  # =========================
  # 3️⃣ NOTIFY
  # =========================
  notify:
    name: Notify
    runs-on: ubuntu-24.04
    needs: [ci, build-scan-push, deploy]
    # Luôn gửi mail, kể cả khi CI / build / scan fail (deploy bị skip)
    if: always()
    timeout-minutes: 5
    steps:
      - name: Send Email
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ needs.deploy.result == 'success' && '✅' || '❌' }} Deploy ${{ github.repository }}: ${{ needs.deploy.result == 'success' && 'success' || 'failed' }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions
          body: |
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            CI:                ${{ needs.ci.result }}
            Build/Scan/Push:   ${{ needs.build-scan-push.result }}
            Deploy:            ${{ needs.deploy.result }}

            Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
